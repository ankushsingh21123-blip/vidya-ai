name: Regenerate package-lock (one-off, manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lock-regen
  cancel-in-progress: false

jobs:
  regen-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate lockfile from landed package.json (no install scripts)
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from regenerated lock (no install scripts)
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: End-to-end tests (4 labelled-mock flows)
        run: npx playwright test

      - name: Commit ONLY package-lock.json (github-actions bot identity)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile unchanged, nothing to commit"
            exit 0
          fi
          git status --short
          git commit -m "Regenerate package-lock.json from landed package.json (one-off workflow_dispatch)"
          git push
